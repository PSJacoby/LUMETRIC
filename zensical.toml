[project]
site_name= "LUMETRIC"
site_url = "https://www.lumetric-imaging.com"
repo_url = "https://github.com/PSJacoby/LUMETRIC"
repo_name = "PSJacoby/LUMETRIC"
nav = [
    {"Home" = "index.md"},
    {"Configuration" = [
        "Configuration/Install.md",
        "Configuration/ArduinoAssembly.md"
    ]},
    {"LUMETRIC GUI" = [
        "LUMETRIC GUI/Interface.md",
        "LUMETRIC GUI/Singlechannel.md",
        "LUMETRIC GUI/Multichannel.md"
    ]},
    {"Architecture" = [
        "Architecture/Diagrams.md"
    ]},
    {"FAQ" = "FAQ.md"}
]
[project.theme]
features = [
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.footer",
    "navigation.instant",
    "toc.integrate",
    "toc.follow",
    "search.suggest",
    "search.highlight"]
font = false
custom_dir = "overrides"
[project.theme.icon]
repo = "fontawesome/brands/github"
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toogle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toogle.name = "Switch to light mode"

[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.blocks.caption]
[project.extra.analytics]
provider = "custom"
property = "umami"
